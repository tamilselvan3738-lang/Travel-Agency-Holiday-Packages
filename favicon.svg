<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="travelBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Rounded squircle badge base -->
  <rect width="40" height="40" rx="13" fill="url(#travelBadgeGrad)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="12.5" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
  <!-- Tropical golden sun with warm aura -->
  <circle cx="28" cy="13" r="8.5" fill="url(#sunGrad)" opacity="0.3"/>
  <circle cx="28" cy="13" r="6" fill="url(#sunGrad)"/>
  <!-- Globe latitude/navigation meridian -->
  <path d="M 6 22 A 16 16 0 0 1 34 22" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
  <!-- Tropical ocean wave layers -->
  <path d="M0 27 C 8 23, 14 31, 22 27 C 30 23, 34 29, 40 26 L 40 40 L 0 40 Z" fill="url(#waveGrad)" opacity="0.45"/>
  <path d="M0 31 C 8 28, 16 34, 24 30 C 32 27, 36 32, 40 29 L 40 40 L 0 40 Z" fill="#ffffff" opacity="0.85"/>
  <!-- Dashed flight trajectory -->
  <path d="M 5 35 Q 16 23 29 11" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" stroke-dasharray="2.5 2.5" fill="none"/>
  <!-- Miniature supersonic passenger jet taking off -->
  <g transform="translate(29, 11) rotate(45) scale(0.72)">
    <path d="M0 -9 L4 3 L10 5 L10 7 L4 6 L2 11 L5 14 L5 15 L0 14 L-5 15 L-5 14 L-2 11 L-4 6 L-10 7 L-10 5 L-4 3 Z" fill="#ffffff"/>
  </g>
</svg>
